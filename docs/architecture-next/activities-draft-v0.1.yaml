# =====================================================================
#  生活活动库 Activity Library  v0.1
#  适用于：大多数现实世界的人类角色，带 scope: student 的条目仅适用于学生
#  设计原则：类型由人定义，内容由外部数据填充；角色个性只通过 modifiers 调制概率
# =====================================================================
#
# ---------------------------- 字段说明 --------------------------------
#
# id            唯一标识，蛇形命名
# name          中文名
# category      分类，见 categories
# scope         适用范围：universal（所有人）| student | worker
# description   一句话说明，给开发者看，不进 prompt
#
# triggers      触发器列表。任一触发器命中即进入候选，再按概率抽取。
#   - type: random        基础随机。rate 为每周期望次数（rate_per_week）
#   - type: time_window   时间窗口。windows: ["HH:MM-HH:MM"], weekdays: [1-7]，p 为窗口内命中概率
#   - type: state         角色状态条件。cond 为表达式，如 "stress > 0.6"
#   - type: env           环境条件。weather / season / temp_c / daylight
#   - type: calendar      日历事件。event 为 sources.calendar 中的事件 id
#   - type: chain         由其他活动派生。after 为前置活动 id，delay_h 为延迟范围
#   - type: intent        角色挂起的意图被满足时触发（如收藏的展、想买的东西）
#   - type: feed          外部信息流中出现匹配兴趣的新条目
#   每个触发器可带 p（命中后实际发生的概率，默认 1.0）
#   chain 触发器可带 when：对前置活动产出的条件过滤，如 "outcome.finished == true"
#
# gating        硬性前置条件，不满足则不能发生
#   time_min      需要的连续空闲分钟数
#   energy_min    最低体力 [0,1]
#   money_min     最低可用余额（货币单位由经济系统定义）
#   locations     可发生的地点类型：home, campus, workplace, outdoor, venue, transit, any
#   requires      需要的物品或条件，如 [kitchen, umbrella, laptop]
#   excludes_state  处于这些状态时不能发生，如 [sick, exam_week]
#
# frequency     频率约束
#   cooldown_h    两次之间的最短间隔（小时）
#   max_per_week  每周上限
#
# duration_min  持续时间范围 [最短, 最长]（分钟），用于日程占位和 Live2D 时间线
#
# cost          资源消耗
#   money         [最小, 最大] 或 source:<id>（从外部取真实价格）
#   energy        体力变化，负数为消耗
#
# inputs        外部输入源 id 列表，见 sources。按顺序尝试，前一个失败则降级到下一个
#
# llm           LLM 用量
#   tier          none | text | vision | image_gen | audio
#   calls         单次活动预计调用次数
#
# outputs       产出类型列表，见 output_types
#
# followups     可能派生的后续活动
#   - activity: <id>, p: 概率, delay_h: [最短, 最长]
#
# share         分享倾向（交给主动联系模块决定是否真的发送）
#   score         low | medium | high
#   form          text | link | image | voice
#
# presentation  表现层提示（给 Live2D / 桌面端）
#   pose          idle | reading | phone | writing | eating | sleeping | out | screen | music
#   interruptible 是否可被用户消息打断
#
# social        solo | npc_optional | npc_required
#
# modifiers     角色个性对触发概率的调制（这是角色与库解耦的关键）
#   traits        大五人格维度的系数 k，取值建议 [-1, 1]
#                 维度：openness, conscientiousness, extraversion, agreeableness, neuroticism
#                 角色的特质值 t ∈ [0,1]，乘数 = max(0, 1 + k * (2t - 1))
#   interests     兴趣标签。角色兴趣引擎中该标签的分数越高，概率越高；
#                 同时活动完成后会向这些标签累积曝光
#
# variants      同一活动的不同形态，执行时按条件或随机选择一种
#
# visibility    产出默认可见性：public | owner_only
#
# ---------------------------------------------------------------------

version: "0.1"

categories:
  daily:        起居与家务
  food:         吃喝
  errand:       跑腿与购物
  media:        看与听
  creative:     创作
  learning:     学习与自我提升
  study_work:   课业与工作
  social:       社交
  outdoor:      户外与出行
  culture:      文化场馆与活动
  fitness:      运动与身体
  digital:      数字生活
  inner:        内心活动
  seasonal:     节日与季节

output_types:
  impression:   结构化印象（喜欢/不喜欢、一句话感受、记住的细节）
  review:       观后感 / 读后感 / 短评
  note:         笔记、摘抄、待办
  diary:        日记
  artwork_svg:  简笔画（LLM 生成 SVG，成本低）
  artwork_img:  图像作品（生图，成本高）
  photo:        照片（从地点照片库或街景选取，可附取景说明）
  purchase:     消费记录（写入经济系统）
  item:         获得物品（写入物品库）
  skill_delta:  技能熟练度变化
  progress:     任务进度变化（作业、阅读等）
  memory:       写入长期记忆的事件
  interest_exposure: 兴趣曝光（写入兴趣引擎）
  mood_delta:   情绪变化
  stress_delta: 压力变化
  intent:       新的挂起意图（想去、想买、想试）
  npc_update:   配角关系或状态变化
  share_candidate: 可分享的瞬间

sources:
  # —— 基础环境 ——
  weather:            { desc: 实时天气与预报, examples: [高德天气, 和风天气, Open-Meteo] }
  sun_moon:           { desc: 日出日落、月相、天象, examples: [skyfield, astral] }
  calendar_holidays:  { desc: 法定节假日与调休, examples: [国务院放假安排, holiday-cn] }
  solar_terms:        { desc: 二十四节气与农历, examples: [lunar-python] }
  anniversaries:      { desc: 名人诞辰忌日、历史上的今天, examples: [Wikidata] }
  school_calendar:    { desc: 校历、考试周、开学放假, examples: [学校教务处官网] }
  # —— 地理 ——
  poi_search:         { desc: 周边地点、营业时间、人均, examples: [高德 POI, 百度地点检索] }
  route_planner:      { desc: 步行/公交/驾车路径与耗时, examples: [高德路径规划] }
  place_photos:       { desc: 开发者自拍的地点照片库, examples: [本地目录] }
  street_view:        { desc: 街景静态图, examples: [百度全景静态图] }
  local_events:       { desc: 本地展览、演出、讲座、市集, examples: [豆瓣同城, 场馆公众号, 校园 BBS] }
  # —— 媒介 ——
  rss_feed:           { desc: 通用信息流, examples: [RSSHub] }
  video_platform:     { desc: 视频标题、字幕、弹幕、评论, examples: [B 站 via RSSHub] }
  movie_db:           { desc: 电影剧情简介、短评、影评, examples: [豆瓣电影, TMDB] }
  anime_schedule:     { desc: 番剧/剧集放送表与分集简介, examples: [Bangumi API] }
  music_charts:       { desc: 榜单、歌曲信息、评论, examples: [网易云音乐, Last.fm] }
  podcast_rss:        { desc: 播客节目与音频, examples: [播客 RSS] }
  bookshelf:          { desc: 本地书库与阅读进度, examples: [插件内置书库] }
  public_domain_text: { desc: 公版诗文, examples: [古诗文库, Project Gutenberg] }
  recipe_site:        { desc: 菜谱, examples: [下厨房, TheMealDB] }
  daily_puzzle:       { desc: 每日谜题, examples: [中文 Wordle, 数独生成器] }
  trending:           { desc: 热搜、热榜, examples: [微博热搜, 知乎热榜 via RSSHub] }
  shopping_trends:    { desc: 新品、种草, examples: [小红书 via RSSHub] }
  # —— 插件内部系统 ——
  memory_store:       { desc: 长期记忆库, examples: [记忆插件] }
  npc_roster:         { desc: 配角名册与关系, examples: [插件内置] }
  economy:            { desc: 余额、账本、预算, examples: [插件内置] }
  inventory:          { desc: 物品库（衣物、书、日用品）, examples: [插件内置] }
  course_system:      { desc: 课表、作业、考试, examples: [插件内置] }
  job_system:         { desc: 兼职与工作排班, examples: [插件内置] }
  interest_engine:    { desc: 兴趣状态与曝光, examples: [插件内置] }

# =====================================================================
#  活动
# =====================================================================
activities:

# ---------------------------- 起居与家务 ------------------------------

  - id: oversleep
    name: 赖床
    category: daily
    scope: universal
    description: 闹钟响后继续躺着，可能导致迟到
    triggers:
      - { type: time_window, windows: ["06:30-10:00"], p: 0.3 }
      - { type: state, cond: "sleep_debt > 0.5", p: 0.6 }
      - { type: env, temp_c: "< 8", p: 0.4 }
    gating: { locations: [home] }
    frequency: { cooldown_h: 20 }
    duration_min: [10, 90]
    cost: { energy: 0.05 }
    inputs: [weather]
    llm: { tier: none, calls: 0 }
    outputs: [mood_delta]
    followups:
      - { activity: skip_class, p: 0.25, delay_h: [0, 1] }
    share: { score: low, form: text }
    presentation: { pose: sleeping, interruptible: true }
    social: solo
    modifiers:
      traits: { conscientiousness: -0.6 }
    visibility: public

  - id: nap
    name: 午睡
    category: daily
    scope: universal
    triggers:
      - { type: time_window, windows: ["12:30-15:00"], p: 0.4 }
      - { type: state, cond: "energy < 0.3", p: 0.7 }
    gating: { time_min: 30, locations: [home, campus] }
    frequency: { cooldown_h: 20 }
    duration_min: [20, 120]
    cost: { energy: 0.3 }
    llm: { tier: none, calls: 0 }
    outputs: [mood_delta]
    followups:
      - { activity: skip_class, p: 0.1, delay_h: [0, 1] }
    share: { score: low, form: text }
    presentation: { pose: sleeping, interruptible: true }
    social: solo
    visibility: public

  - id: shower
    name: 洗澡
    category: daily
    scope: universal
    triggers:
      - { type: time_window, windows: ["19:00-23:30"], p: 0.8 }
      - { type: chain, after: exercise, delay_h: [0, 1] }
    gating: { locations: [home], requires: [hot_water_available] }
    frequency: { cooldown_h: 12 }
    duration_min: [15, 40]
    llm: { tier: none, calls: 0 }
    outputs: [mood_delta]
    share: { score: low, form: text }
    presentation: { pose: idle, interruptible: false }
    social: solo
    visibility: public

  - id: laundry
    name: 洗衣服
    category: daily
    scope: universal
    triggers:
      - { type: state, cond: "dirty_clothes > 0.7", p: 0.8 }
      - { type: random, rate: 1.5 }
    gating: { time_min: 20, locations: [home] }
    frequency: { cooldown_h: 48 }
    duration_min: [20, 60]
    cost: { money: [0, 5], energy: -0.05 }
    inputs: [weather]
    llm: { tier: none, calls: 0 }
    outputs: [mood_delta]
    followups:
      - { activity: clothes_wont_dry, p: 0.0, delay_h: [24, 72] }   # 概率由天气决定：连续阴雨时上调
    share: { score: low, form: text }
    presentation: { pose: idle, interruptible: true }
    social: solo
    visibility: public

  - id: clothes_wont_dry
    name: 衣服晾不干
    category: daily
    scope: universal
    description: 连续阴雨天的小烦恼，只由 laundry 派生
    triggers:
      - { type: chain, after: laundry, delay_h: [24, 72] }
    gating: {}
    duration_min: [0, 0]
    inputs: [weather]
    llm: { tier: none, calls: 0 }
    outputs: [mood_delta]
    share: { score: low, form: text }
    presentation: { pose: idle, interruptible: true }
    social: solo
    visibility: public

  - id: tidy_room
    name: 收拾房间
    category: daily
    scope: universal
    triggers:
      - { type: random, rate: 0.5 }
      - { type: calendar, event: term_start, p: 0.6 }
      - { type: chain, after: exam, delay_h: [12, 48], p: 0.3 }
      - { type: state, cond: "procrastinating == true", p: 0.15 }   # 用收拾房间逃避正事
    gating: { time_min: 30, locations: [home], energy_min: 0.3 }
    frequency: { cooldown_h: 72 }
    duration_min: [30, 120]
    cost: { energy: -0.15 }
    inputs: [inventory, memory_store]
    llm: { tier: text, calls: 1 }
    outputs: [mood_delta, memory]
    followups:
      - { activity: revisit_old_memory, p: 0.3, delay_h: [0, 0] }   # 翻出旧物
      - { activity: revive_old_hobby, p: 0.1, delay_h: [0, 24] }
    share: { score: low, form: text }
    presentation: { pose: idle, interruptible: true }
    social: solo
    modifiers:
      traits: { conscientiousness: 0.5 }
    visibility: public

  - id: seasonal_wardrobe
    name: 换季整理衣柜
    category: daily
    scope: universal
    triggers:
      - { type: env, temp_c: "crosses 15", p: 0.7 }
      - { type: env, temp_c: "crosses 25", p: 0.7 }
    gating: { time_min: 40, locations: [home] }
    frequency: { cooldown_h: 720 }
    duration_min: [40, 120]
    inputs: [weather, inventory]
    llm: { tier: none, calls: 0 }
    outputs: [intent]          # 可能产生「想买件厚外套」的意图
    share: { score: low, form: text }
    presentation: { pose: idle, interruptible: true }
    social: solo
    visibility: public

  - id: haircut
    name: 剪头发
    category: daily
    scope: universal
    triggers:
      - { type: state, cond: "days_since_haircut > 40", p: 0.15 }
    gating: { time_min: 60, money_min: 30, locations: [venue] }
    frequency: { cooldown_h: 600 }
    duration_min: [30, 90]
    cost: { money: source:poi_search, energy: -0.05 }
    inputs: [poi_search, route_planner]
    llm: { tier: text, calls: 1 }
    outputs: [purchase, mood_delta, memory]
    share: { score: medium, form: text }
    presentation: { pose: out, interruptible: true }
    social: solo
    variants: [satisfied, regret]
    visibility: public

  - id: minor_illness
    name: 小病（感冒等）
    category: daily
    scope: universal
    description: 偶发的轻微不适，持续数日，降低体力与活动意愿
    triggers:
      - { type: state, cond: "sleep_debt > 0.7", p: 0.05 }
      - { type: env, season: [autumn, spring], p: 0.02 }
      - { type: chain, after: caught_in_rain, delay_h: [12, 36], p: 0.2 }
    gating: {}
    frequency: { cooldown_h: 480 }
    duration_min: [1440, 5760]
    cost: { energy: -0.3 }
    llm: { tier: none, calls: 0 }
    outputs: [mood_delta, memory]
    followups:
      - { activity: skip_class, p: 0.4, delay_h: [0, 24] }
    share: { score: medium, form: text }
    presentation: { pose: sleeping, interruptible: true }
    social: solo
    visibility: public

  - id: insomnia
    name: 失眠
    category: daily
    scope: universal
    triggers:
      - { type: state, cond: "stress > 0.6", p: 0.3 }
      - { type: chain, after: drink_caffeine, delay_h: [4, 8], p: 0.3 }
      - { type: random, rate: 0.3 }
    gating: { locations: [home] }
    frequency: { cooldown_h: 24 }
    duration_min: [30, 180]
    cost: { energy: -0.2 }
    inputs: [memory_store]
    llm: { tier: text, calls: 1 }
    outputs: [mood_delta, note]
    followups:
      - { activity: scroll_feed, p: 0.6, delay_h: [0, 0] }
      - { activity: oversleep, p: 0.5, delay_h: [6, 9] }
    share: { score: medium, form: text }        # 深夜主动联系的契机
    presentation: { pose: phone, interruptible: true }
    social: solo
    modifiers:
      traits: { neuroticism: 0.6 }
    visibility: public

# ------------------------------ 吃喝 ---------------------------------

  - id: meal
    name: 吃饭
    category: food
    scope: universal
    triggers:
      - { type: time_window, windows: ["07:00-09:30", "11:00-13:30", "17:00-19:30"], p: 0.9 }
    gating: { time_min: 15 }
    frequency: { cooldown_h: 3 }
    duration_min: [10, 60]
    cost: { money: source:economy, energy: 0.15 }
    inputs: [poi_search, economy]
    llm: { tier: none, calls: 0 }
    outputs: [purchase]
    share: { score: low, form: text }
    presentation: { pose: eating, interruptible: true }
    social: npc_optional
    variants: [cafeteria, takeout, eat_out, cook_self, skip]
    visibility: public

  - id: try_new_restaurant
    name: 尝试新餐厅
    category: food
    scope: universal
    triggers:
      - { type: intent, intent: want_to_try_restaurant, p: 0.3 }
      - { type: random, rate: 0.3 }
    gating: { time_min: 60, money_min: 50 }
    frequency: { cooldown_h: 96 }
    duration_min: [45, 120]
    cost: { money: source:poi_search, energy: -0.05 }
    inputs: [poi_search, route_planner, shopping_trends]
    llm: { tier: text, calls: 1 }
    outputs: [purchase, review, memory, interest_exposure]
    share: { score: medium, form: text }
    presentation: { pose: out, interruptible: true }
    social: npc_optional
    modifiers:
      traits: { openness: 0.5, extraversion: 0.3 }
      interests: [food]
    visibility: public

  - id: cook
    name: 做饭
    category: food
    scope: universal
    triggers:
      - { type: random, rate: 1 }
      - { type: feed, match: [recipe, cooking], p: 0.2 }
    gating: { time_min: 40, requires: [kitchen], locations: [home] }
    frequency: { cooldown_h: 24 }
    duration_min: [30, 90]
    cost: { money: [10, 40], energy: -0.1 }
    inputs: [recipe_site]
    llm: { tier: text, calls: 1 }
    outputs: [skill_delta, mood_delta, memory, share_candidate]
    share: { score: medium, form: image }
    presentation: { pose: idle, interruptible: true }
    social: npc_optional
    modifiers:
      interests: [cooking, food]
    variants: [success, partial, disaster]      # 结果概率由 skill 决定
    visibility: public

  - id: snack_run
    name: 买零食饮料
    category: food
    scope: universal
    triggers:
      - { type: random, rate: 2 }
      - { type: state, cond: "stress > 0.5", p: 0.2 }
      - { type: feed, match: [snack, new_product], p: 0.15 }
    gating: { time_min: 10, money_min: 10 }
    frequency: { cooldown_h: 12 }
    duration_min: [10, 30]
    cost: { money: [5, 30] }
    inputs: [shopping_trends, poi_search]
    llm: { tier: none, calls: 0 }
    outputs: [purchase, mood_delta]
    share: { score: low, form: text }
    presentation: { pose: out, interruptible: true }
    social: solo
    visibility: public

  - id: drink_caffeine
    name: 喝咖啡或茶
    category: food
    scope: universal
    triggers:
      - { type: state, cond: "energy < 0.4 and has_task == true", p: 0.4 }
      - { type: time_window, windows: ["09:00-16:00"], p: 0.2 }
    gating: {}
    frequency: { cooldown_h: 4 }
    duration_min: [5, 30]
    cost: { money: [0, 30], energy: 0.15 }
    llm: { tier: none, calls: 0 }
    outputs: [purchase]
    followups:
      - { activity: insomnia, p: 0.2, delay_h: [4, 8] }
    share: { score: low, form: text }
    presentation: { pose: idle, interruptible: true }
    social: solo
    visibility: public

# --------------------------- 跑腿与购物 -------------------------------

  - id: online_shopping
    name: 网购
    category: errand
    scope: universal
    triggers:
      - { type: intent, intent: want_to_buy, p: 0.4 }
      - { type: calendar, event: shopping_festival, p: 0.7 }
      - { type: state, cond: "stress > 0.6", p: 0.1 }
    gating: { money_min: 20 }
    frequency: { cooldown_h: 48 }
    duration_min: [10, 60]
    cost: { money: source:economy }
    inputs: [shopping_trends, economy]
    llm: { tier: text, calls: 1 }        # 只在纠结的大额消费时调用
    outputs: [purchase, mood_delta]
    followups:
      - { activity: pick_up_parcel, p: 1.0, delay_h: [24, 96] }
    share: { score: low, form: text }
    presentation: { pose: phone, interruptible: true }
    social: solo
    visibility: public

  - id: pick_up_parcel
    name: 取快递
    category: errand
    scope: universal
    description: 只由网购派生；拆开后可能满意也可能失望
    triggers:
      - { type: chain, after: online_shopping, delay_h: [24, 96] }
    gating: { time_min: 10 }
    duration_min: [10, 30]
    cost: { energy: -0.05 }
    llm: { tier: none, calls: 0 }
    outputs: [item, mood_delta]
    share: { score: medium, form: image }
    presentation: { pose: out, interruptible: true }
    social: solo
    variants: [happy, meh, disappointed, wrong_item]
    visibility: public

  - id: buy_daily_goods
    name: 买日用品
    category: errand
    scope: universal
    triggers:
