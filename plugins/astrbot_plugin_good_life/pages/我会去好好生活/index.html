<!doctype html>
<html lang="zh-CN" data-theme="walnut">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我会去好好生活</title>
  <link rel="stylesheet" href="state-tokens.css">
  <link rel="stylesheet" href="state-page.css">
  <link rel="stylesheet" href="state-config.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="overview.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="timetable.css?v=2">
  <script src="/api/plugin/page/bridge-sdk.js" defer></script>
  <script src="icons.js" defer></script>
  <script src="calendar-editor.js" defer></script>
  <script src="state-maintenance.js" defer></script>
  <script src="state-editor.js" defer></script>
  <script src="overview.js?v=7" defer></script>
  <script src="calendar-view.js" defer></script>
  <script src="wallet-view.js" defer></script>
  <script src="timetable-view.js?v=2" defer></script>
  <script src="timetable-page.js?v=2" defer></script>
  <script src="life-bundle.js?v=7" defer></script>
  <script src="app.js?v=8" defer></script>
</head>
<body>
  <div class="gl-shell" id="shell" data-rail="closed">
    <aside class="gl-rail" id="rail" aria-label="生活管理导航">
      <div class="gl-brand">
        <span class="gl-brand-mark"><i data-icon="sprout"></i></span>
        <span class="gl-brand-copy"><strong>我会去好好生活</strong><small>把平常的日子，慢慢过好</small></span>
        <button class="gl-icon-button gl-rail-close" id="rail-close" type="button" aria-label="收起导航"><i data-icon="close"></i></button>
      </div>
      <section class="gl-scope" aria-label="选择生活范围">
        <label>私聊窗口<select id="target" disabled></select></label>
        <label>角色<select id="role" disabled></select></label>
        <div class="gl-scope-foot">
          <span class="gl-connection" data-offline><span class="gl-dot" aria-hidden="true"></span><span id="connection">正在连接…</span></span>
          <button id="refresh" class="gl-icon-button" type="button" aria-label="刷新" title="刷新"><i data-icon="refresh"></i></button>
        </div>
      </section>
      <nav id="navigation" class="gl-nav" aria-label="生活管理">
        <p class="gl-nav-title">生活</p>
        <button type="button" class="gl-nav-link" data-page="overview" aria-current="page"><i data-icon="overview"></i><span>生活总览</span></button>
        <button type="button" class="gl-nav-link" data-page="calendar" aria-current="false"><i data-icon="calendar"></i><span>日程</span></button>
        <button type="button" class="gl-nav-link" data-page="timetable" aria-current="false"><i data-icon="timetable"></i><span>课表</span></button>
        <button type="button" class="gl-nav-link" data-page="wallet" aria-current="false"><i data-icon="wallet"></i><span>钱包</span></button>
        <p class="gl-nav-title">记录</p>
        <button type="button" class="gl-nav-link" data-page="reading" aria-current="false"><i data-icon="book"></i><span>阅读</span></button>
        <button type="button" class="gl-nav-link" data-page="browsing" aria-current="false"><i data-icon="compass"></i><span>浏览</span></button>
        <p class="gl-nav-title">设置</p>
        <button type="button" class="gl-nav-link" data-page="settings" aria-current="false"><i data-icon="sliders"></i><span>作息与设置</span></button>
      </nav>
      <div class="gl-rail-foot">
        <a id="companion-link" class="gl-nav-link" href="/#/plugin-view/astrbot_plugin_private_companion/%E9%99%AA%E4%BC%B4%E5%B0%8F%E5%B1%8B"><i data-icon="house"></i><span>返回陪伴小屋</span></a>
        <p class="gl-rail-note">日记、梦境与社交账号仍在陪伴小屋管理。按住 Ctrl / ⌘ 点击链接，或从左侧扩展功能打开。</p>
      </div>
    </aside>
    <div class="gl-scrim" id="rail-scrim" hidden></div>
    <div class="gl-body">
      <header class="gl-topbar">
        <button class="gl-icon-button gl-rail-open" id="rail-open" type="button" aria-label="打开导航" aria-controls="rail" aria-expanded="false"><i data-icon="menu"></i></button>
        <div class="gl-topbar-title"><p class="gl-eyebrow" id="page-eyebrow">今天</p><h1 id="page-title">生活总览</h1></div>
        <div class="gl-topbar-info" id="topbar-info" aria-live="off">
          <span class="gl-topbar-scope" id="topbar-scope" hidden></span>
          <span class="gl-topbar-clock"><i data-icon="clock"></i><time id="topbar-time">--:--</time><small id="topbar-date"></small></span>
        </div>
      </header>
      <p id="notice" class="gl-notice" role="status" aria-live="polite" hidden></p>
      <main class="gl-main">
        <section id="overview" class="page gl-overview" aria-labelledby="page-title">
          <div class="gl-overview-main">
            <article class="gl-card gl-card-now"><header class="gl-card-head"><h2>此刻</h2><span class="gl-card-note">正在做的事</span></header><div id="current" class="gl-now">正在读取…</div></article>
            <article class="gl-card"><header class="gl-card-head"><h2>作息</h2><span class="gl-card-note">睡眠与节律</span></header><div id="sleep-summary" class="gl-rest">正在读取…</div></article>
            <article class="gl-card"><header class="gl-card-head"><h2>此刻的状态</h2>
              <button class="gl-text-button" type="button" data-go="settings">调整状态</button></header><div id="body-state">正在读取…</div></article>
          </div>
          <article class="gl-card gl-card-agenda"><header class="gl-card-head"><h2>今日安排</h2>
            <button class="gl-text-button" type="button" data-go="calendar">管理日程</button></header><div id="upcoming">正在读取…</div></article>
          <div class="gl-pills" role="group" aria-label="常用入口">
            <button class="gl-pill" type="button" data-go="calendar"><i data-icon="calendar"></i>日程</button>
            <button class="gl-pill" type="button" data-go="reading"><i data-icon="book"></i>阅读书架</button>
            <button class="gl-pill" type="button" data-go="browsing"><i data-icon="compass"></i>浏览记录</button>
            <button class="gl-pill" type="button" data-go="settings"><i data-icon="sliders"></i>作息与设置</button>
          </div>
        </section>
        <section id="calendar" class="page gl-calendar" hidden aria-labelledby="page-title">
          <article class="gl-card gl-cal-card" id="calendar-month" aria-label="月历">正在读取…</article>
          <article class="gl-card gl-card-agenda" id="calendar-day" aria-live="polite">正在读取…</article>
          <div id="calendar-editor" class="gl-card gl-cal-plans">正在读取日程…</div>
          <div id="calendar-planning" class="gl-card gl-cal-planning state-config-page" hidden></div></section>
        <section id="wallet" class="page gl-wallet" hidden aria-labelledby="page-title">正在读取钱包…</section>
        <section id="timetable" class="page gl-timetable" hidden aria-labelledby="page-title">正在读取课表…</section>
        <section id="workspace" class="page" hidden>
          <div id="reading-nav" class="subnav" hidden>
            <button type="button" data-reading="reading" aria-current="page">书架与进度</button>
            <button type="button" data-reading="notes">读书笔记</button>
          </div>
          <article id="state-settings" class="gl-card state-config-page" hidden>
            <header class="gl-card-head"><h2>角色状态设置</h2></header>
            <nav id="state-features" class="subnav" aria-label="角色状态配置">
              <button type="button" data-state-feature="maintenance" aria-current="page">维护</button>
              <button type="button" data-state-feature="home">功能与展示</button>
              <button type="button" data-state-feature="energy">精力</button>
              <button type="button" data-state-feature="health">健康</button>
              <button type="button" data-state-feature="hunger">饥饿</button>
              <button type="button" data-state-feature="cycle">周期</button>
              <button type="button" data-state-feature="mood">心情</button>
              <button type="button" data-state-feature="patrol">巡检</button>
            </nav>
            <div id="state-settings-editor">正在读取…</div>
          </article>
          <iframe id="life-frame" title="生活管理" sandbox="allow-scripts allow-forms allow-downloads"></iframe>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
